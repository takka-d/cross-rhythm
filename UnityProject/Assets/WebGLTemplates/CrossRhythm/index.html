<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cross Rhythm</title><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070c10;color:#e8f0f4;font:16px system-ui,sans-serif}#unity-canvas{width:100%;height:100%;display:block;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:20px;text-align:center;background:#070c10}h1{letter-spacing:.1em;color:#8fe5c2}progress{width:300px;accent-color:#8fe5c2}#error{max-width:680px;white-space:pre-wrap;line-height:1.7}button{padding:15px 30px;font:inherit;border:0;background:#8fe5c2;color:#071e16;cursor:pointer}</style></head>
<body><canvas id="unity-canvas" tabindex="0"></canvas><div id="loading"><h1>CROSS RHYTHM</h1><progress id="progress" max="1" value="0"></progress><div id="message">Loading…</div><div id="error"></div></div>
<script src="project-picker.js?v={{{ PRODUCT_VERSION }}}"></script>
<script src="editor-input.js?v={{{ PRODUCT_VERSION }}}"></script>
<script src="midi-drop.js?v={{{ PRODUCT_VERSION }}}"></script>
<script src="fullscreen.js?v={{{ PRODUCT_VERSION }}}"></script>
<script>var canvas=document.getElementById('unity-canvas');var config={dataUrl:'Build/{{{ DATA_FILENAME }}}?v={{{ PRODUCT_VERSION }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}?v={{{ PRODUCT_VERSION }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}?v={{{ PRODUCT_VERSION }}}',streamingAssetsUrl:'StreamingAssets',companyName:'TakKa',productName:'Cross Rhythm',productVersion:'{{{ PRODUCT_VERSION }}}',matchWebGLToCanvasSize:true,autoSyncPersistentDataPath:true};var loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}?v={{{ PRODUCT_VERSION }}}';loader.onload=()=>createUnityInstance(canvas,config,p=>document.getElementById('progress').value=p).then(instance=>{window.crossRhythm=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(e=>{document.getElementById('message').textContent='起動できませんでした / Unable to start';document.getElementById('error').textContent=String(e);});document.body.appendChild(loader);canvas.addEventListener('wheel',e=>e.preventDefault(),{passive:false});</script></body></html>
