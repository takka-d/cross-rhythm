name: Cross Rhythm Unity build artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Build with the installed licensed Unity Editor
        shell: powershell
        env:
          CROSSRHYTHM_DEV_BUILD: '1'
        run: .\UnityProject\Build.ps1 -Target Both
      - uses: actions/upload-artifact@v4
        with:
          name: CrossRhythm-Unity-builds
          path: UnityProject/Builds
