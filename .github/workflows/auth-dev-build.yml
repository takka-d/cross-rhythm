CERT

          # Force a pseudo-TTY so the device-login prompt is emitted immediately.
          RUNNER_TRACKING_ID="" nohup setsid script -q -f -c "unity auth login --format ndjson" "$out" </dev/null >/dev/null 2>&1 &
          echo $! > "$pidfile"

          for i in $(seq 1 90); do
            if [ -f "$out" ]; then
              python3 - "$out" "$RUNNER_TEMP/unity-auth-url.txt" <<'PY'
import re,sys
p=sys.argv[1]; out=sys.argv[2]
try:
    s=open(p,'rb').read().decode('utf-8','ignore')
except FileNotFoundError:
    raise SystemExit
s=s.replace('\\u0026','&').replace('\\/','/')
urls=re.findall(r'https://[^\s"<>\\]+',s)
urls=[u.rstrip('.,;') for u in urls if 'unity' in u.lower()]
if urls:
    open(out,'w',encoding='utf-8').write(urls[0]+'\n')
PY
            fi
            if [ -s "$RUNNER_TEMP/unity-auth-url.txt" ]; then break; fi
            if ! kill -0 "$(cat "$pidfile")" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ ! -s "$RUNNER_TEMP/unity-auth-url.txt" ]; then
            echo "::error::Unity sign-in URL was not emitted."
            if [ -f "$out" ]; then
              # Do not print potentially sensitive output; encrypt it for diagnosis.
              openssl cms -encrypt -binary -aes-256-cbc -outform DER                 -in "$out" -out "$RUNNER_TEMP/unity-auth-url.cms.der" "$RUNNER_TEMP/auth-cert.pem"
              base64 -w 0 "$RUNNER_TEMP/unity-auth-url.cms.der" > "$RUNNER_TEMP/unity-auth-url.cms.b64"
            fi
            exit 1
          fi

          openssl cms -encrypt -binary -aes-256-cbc -outform DER             -in "$RUNNER_TEMP/unity-auth-url.txt" -out "$RUNNER_TEMP/unity-auth-url.cms.der" "$RUNNER_TEMP/auth-cert.pem"
          base64 -w 0 "$RUNNER_TEMP/unity-auth-url.cms.der" > "$RUNNER_TEMP/unity-auth-url.cms.b64"
          echo "Unity sign-in URL captured securely."

      - name: Upload encrypted Unity sign-in URL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-sign-in-url-encrypted
          path: ${{ runner.temp }}/unity-auth-url.cms.b64
          retention-days: 1
          if-no-files-found: warn

      - name: Install Unity 6000.3.25f1 with WebGL and Windows Mono
        shell: bash
        run: |
          set -euo pipefail
          unity install 6000.3.25f1 -m webgl windows-mono --accept-eula --yes --non-interactive
          unity editors --format json

      - name: Wait for Unity sign-in
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat "$RUNNER_TEMP/unity-auth.pid")"
          deadline=$((SECONDS+1200))
          while kill -0 "$pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do
            sleep 3
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            echo "::error::Unity sign-in timed out."
            exit 1
          fi
          unity auth status --format json

      - name: Activate Unity Personal
        shell: bash
        run: |
          set -euo pipefail
          unity license activate --personal --accept-eula --yes --format json
          unity license status --format json

      - name: Build WebGL and Windows
        shell: bash
        run: |
          set -euo pipefail
          EDITOR="/home/runner/Unity/Hub/Editor/6000.3.25f1/Editor/Unity"
          test -x "$EDITOR"
          rm -rf UnityProject/Builds/Web UnityProject/Builds/Windows
          mkdir -p UnityProject/Builds/Web UnityProject/Builds/Windows

          "$EDITOR" -batchmode -nographics -quit -accept-apiupdate             -buildTarget WebGL             -projectPath "$GITHUB_WORKSPACE/UnityProject"             -executeMethod CrossRhythm.CrossRhythmBuild.Web             -buildOutput "$GITHUB_WORKSPACE/UnityProject/Builds/Web"             -logFile "$GITHUB_WORKSPACE/UnityProject/Builds/Web.log"
          test -f UnityProject/Builds/Web/index.html

          "$EDITOR" -batchmode -nographics -quit -accept-apiupdate             -buildTarget Win64             -projectPath "$GITHUB_WORKSPACE/UnityProject"             -executeMethod CrossRhythm.CrossRhythmBuild.Windows             -buildOutput "$GITHUB_WORKSPACE/UnityProject/Builds/Windows/CrossRhythm.exe"             -logFile "$GITHUB_WORKSPACE/UnityProject/Builds/Windows.log"
          test -f UnityProject/Builds/Windows/CrossRhythm.exe

      - name: Prepare noindex development deployment
        shell: python
        run: |
          import hashlib, pathlib, shutil, zipfile, re, math

          root=pathlib.Path.cwd()
          dev=root/"dev"/"0.3.13"
          unity=dev/"unity"
          web=dev/"web"
          windows=dev/"windows"

          for p in (unity,windows):
              if p.exists(): shutil.rmtree(p)
              p.mkdir(parents=True,exist_ok=True)
          web.mkdir(parents=True,exist_ok=True)

          shutil.copytree(root/"UnityProject"/"Builds"/"Web",unity,dirs_exist_ok=True)
          shutil.copy2(root/"LegacyWeb"/"CrossRhythm_Web_v171_ADTOF.html",web/"index.html")

          robots='<meta name="robots" content="noindex,nofollow,noarchive">'
          for p in (unity/"index.html",web/"index.html"):
              s=p.read_text(encoding="utf-8",errors="replace")
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]*>',s,re.I):
                  s=re.sub(r'<meta[^>]+name=["\']robots["\'][^>]*>',robots,s,count=1,flags=re.I)
              else:
                  s=re.sub(r'<head([^>]*)>',r'<head\1>'+robots,s,count=1,flags=re.I)
              p.write_text(s,encoding="utf-8")

          full=root/"CrossRhythm_Windows_0.3.13.zip"
          with zipfile.ZipFile(full,"w",zipfile.ZIP_DEFLATED) as z:
              base=root/"UnityProject"/"Builds"/"Windows"
              for p in base.rglob("*"):
                  if p.is_file(): z.write(p,p.relative_to(base))

          data=full.read_bytes()
          chunk=45*1024*1024
          parts=[]
          for i,start in enumerate(range(0,len(data),chunk),1):
              part=windows/f"CrossRhythm_Windows_0.3.13.zip.part{i}"
              part.write_bytes(data[start:start+chunk])
              parts.append(part.name)
          sha=hashlib.sha256(data).hexdigest()
          (windows/"CrossRhythm_Windows_0.3.13.sha256").write_text(sha+"\n",encoding="utf-8")

          parts_js=",".join(repr(p) for p in parts)
          (windows/"index.html").write_text(f'''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross Rhythm 0.3.13 Windows Development Build</title></head><body><h1>Cross Rhythm 0.3.13 Windows Development Build</h1><p>開発確認用です。本公開版ではありません。</p><button id="d">Download ZIP</button><p id="s"></p><script>const parts=[{parts_js}],expected='{sha}',total={len(data)},b=document.getElementById('d'),s=document.getElementById('s');b.onclick=async()=>{{b.disabled=true;try{{let chunks=[],n=0;for(const p of parts){{const r=await fetch(p);if(!r.ok)throw Error('HTTP '+r.status);const a=new Uint8Array(await r.arrayBuffer());chunks.push(a);n+=a.length;s.textContent=Math.floor(n/total*100)+'%';}}const blob=new Blob(chunks,{{type:'application/zip'}});const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await blob.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('');if(digest!==expected)throw Error('checksum');const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='CrossRhythm_Windows_0.3.13.zip';a.click();s.textContent='Ready';}}catch(e){{s.textContent='Failed: '+e.message;b.disabled=false;}}}};</script></body></html>''',encoding="utf-8")

          (dev/"index.html").write_text('''<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross Rhythm 0.3.13 Development</title></head><body><h1>Cross Rhythm 0.3.13 Development</h1><p>開発確認用です。本公開版ではありません。</p><ul><li><a href="./unity/">Unity WebGL版 0.3.13</a></li><li><a href="./web/">HTML/JavaScript Web版 0.3.13</a></li><li><a href="./windows/">Windows版 0.3.13</a></li></ul></body></html>''',encoding="utf-8")

      - name: Commit dev-only deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TakKa Build"
          git config user.email "80165829+takka-d@users.noreply.github.com"
          git add dev/0.3.13
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Cross Rhythm 0.3.13 development builds (noindex)"
            git push origin main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CrossRhythm-WebGL-0.3.13-dev
          path: UnityProject/Builds/Web
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: CrossRhythm-Windows-0.3.13-dev
          path: CrossRhythm_Windows_0.3.13.zip
          retention-days: 7

      - name: Return temporary Unity Personal license
        if: always()
        shell: bash
        run: |
          unity license return --yes --format json || true
