name: Cross Rhythm 0.3.13 authenticated dev build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-dev-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cross-rhythm-auth-dev-0.3.13
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            UnityProject
            LegacyWeb
            dev/0.3.13
          sparse-checkout-cone-mode: false

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/unity" --version

      - name: Start Unity sign-in and capture URL
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          out="$RUNNER_TEMP/unity-auth.typescript"
          pidfile="$RUNNER_TEMP/unity-auth.pid"
          rm -f "$out" "$pidfile" "$RUNNER_TEMP/unity-auth-url.txt" "$RUNNER_TEMP/unity-auth-url.cms.der" "$RUNNER_TEMP/unity-auth-url.cms.b64"

          cat > "$RUNNER_TEMP/auth-cert.pem" <<'CERT'
-----BEGIN CERTIFICATE-----
MIIFHzCCAwegAwIBAgIUNVwl/vdZsXWiNd1jfXTW/d/oXe8wDQYJKoZIhvcNAQEL
