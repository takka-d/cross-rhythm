name: Cross Rhythm 0.3.13 Linux hosted development build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-dev-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cross-rhythm-linux-dev-0.3.13
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            UnityProject
            LegacyWeb
            dev/0.3.13
          sparse-checkout-cone-mode: false

      - name: Install Unity CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://unity.com/install.sh | UNITY_CLI_CHANNEL=beta bash
          export PATH="$HOME/.local/bin:$PATH"
          command -v unity
          unity --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Unity 6000.3.25f1 with WebGL and Windows Mono modules
        shell: bash
        run: |
          set -euo pipefail
          unity install 6000.3.25f1 -m webgl windows-mono --accept-eula --yes --non-interactive
          unity editors --format json

      - name: Start Unity sign-in and capture URL
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/unity-auth.ndjson"
          pidfile="$RUNNER_TEMP/unity-auth.pid"
          rm -f "$out" "$pidfile"
          RUNNER_TRACKING_ID="" nohup unity auth login --format ndjson >"$out" 2>&1 &
          echo $! > "$pidfile"

          for i in $(seq 1 90); do
            if grep -Eo 'https://[^"[:space:]]+' "$out" >"$RUNNER_TEMP/unity-auth-url.txt" 2>/dev/null; then
              head -n 1 "$RUNNER_TEMP/unity-auth-url.txt" | sed 's/\\u0026/\&/g; s#\\/#/#g' > "$RUNNER_TEMP/unity-auth-url-clean.txt"
              break
            fi
            if ! kill -0 "$(cat "$pidfile")" 2>/dev/null; then
              cat "$out" || true
              exit 1
            fi
            sleep 2
          done

          test -s "$RUNNER_TEMP/unity-auth-url-clean.txt"
          echo "Unity OAuth URL captured. Waiting for browser approval in the next step."

      - name: Upload temporary Unity sign-in URL
        uses: actions/upload-artifact@v4
        with:
          name: unity-sign-in-url
          path: ${{ runner.temp }}/unity-auth-url-clean.txt
          retention-days: 1

      - name: Wait for Unity sign-in
        shell: bash
        run: |
          set -euo pipefail
          pid="$(cat "$RUNNER_TEMP/unity-auth.pid")"
          deadline=$((SECONDS+1200))
          while kill -0 "$pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do
            sleep 3
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            cat "$RUNNER_TEMP/unity-auth.ndjson" || true
            echo "::error::Unity sign-in timed out"
            exit 1
          fi
          cat "$RUNNER_TEMP/unity-auth.ndjson" || true
          unity auth status --format json

      - name: Activate Unity Personal
        shell: bash
        run: |
          set -euo pipefail
          unity license activate --personal --accept-eula --yes --format json
          unity license status --format json

      - name: Build Unity WebGL 0.3.13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf UnityProject/Builds/Web
          mkdir -p UnityProject/Builds/Web
          unity build UnityProject \
            --editor-version 6000.3.25f1 \
            --target WebGL \
            --execute-method CrossRhythm.CrossRhythmBuild.Web \
            --output-path "$GITHUB_WORKSPACE/UnityProject/Builds/Web" \
            --allow-dirty-build \
            --timeout 1800
          test -f UnityProject/Builds/Web/index.html

      - name: Build Unity Windows 0.3.13
        shell: bash
        run: |
          set -euo pipefail
          rm -rf UnityProject/Builds/Windows
          mkdir -p UnityProject/Builds/Windows
          unity build UnityProject \
            --editor-version 6000.3.25f1 \
            --target StandaloneWindows64 \
            --execute-method CrossRhythm.CrossRhythmBuild.Windows \
            --output-path "$GITHUB_WORKSPACE/UnityProject/Builds/Windows/CrossRhythm.exe" \
            --allow-dirty-build \
            --timeout 1800
          test -f UnityProject/Builds/Windows/CrossRhythm.exe

      - name: Prepare noindex development deployment
        shell: python
        run: |
          import hashlib, pathlib, shutil, zipfile, re

          root=pathlib.Path.cwd()
          dev=root/"dev"/"0.3.13"
          unity=dev/"unity"
          web=dev/"web"
          windows=dev/"windows"

          for p in (unity, windows):
              if p.exists(): shutil.rmtree(p)
              p.mkdir(parents=True, exist_ok=True)
          web.mkdir(parents=True, exist_ok=True)

          shutil.copytree(root/"UnityProject"/"Builds"/"Web", unity, dirs_exist_ok=True)
          shutil.copy2(root/"LegacyWeb"/"CrossRhythm_Web_v171_ADTOF.html", web/"index.html")

          robots='<meta name="robots" content="noindex,nofollow,noarchive">'
          for p in (unity/"index.html", web/"index.html"):
              s=p.read_text(encoding="utf-8", errors="replace")
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]*>', s, re.I):
                  s=re.sub(r'<meta[^>]+name=["\']robots["\'][^>]*>', robots, s, count=1, flags=re.I)
              else:
                  s=re.sub(r'<head([^>]*)>', r'<head\1>'+robots, s, count=1, flags=re.I)
              p.write_text(s, encoding="utf-8")

          z=windows/"CrossRhythm_Windows_0.3.13.zip"
          with zipfile.ZipFile(z,"w",zipfile.ZIP_DEFLATED) as out:
              base=root/"UnityProject"/"Builds"/"Windows"
              for p in base.rglob("*"):
                  if p.is_file(): out.write(p,p.relative_to(base))

          (windows/"index.html").write_text(
              '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross Rhythm 0.3.13 Windows Development Build</title></head><body><h1>Cross Rhythm 0.3.13 Windows Development Build</h1><p>開発確認用です。本公開版ではありません。</p><p><a href="./CrossRhythm_Windows_0.3.13.zip" download>Windows版ZIPをDownload</a></p></body></html>',
              encoding="utf-8"
          )
          (dev/"index.html").write_text(
              '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross Rhythm 0.3.13 Development</title></head><body><h1>Cross Rhythm 0.3.13 Development</h1><p>開発確認用です。本公開版ではありません。</p><ul><li><a href="./unity/">Unity WebGL版 0.3.13</a></li><li><a href="./web/">HTML/JavaScript Web版 0.3.13</a></li><li><a href="./windows/">Windows版 0.3.13</a></li></ul></body></html>',
              encoding="utf-8"
          )
          (windows/"CrossRhythm_Windows_0.3.13.sha256").write_text(hashlib.sha256(z.read_bytes()).hexdigest()+"\n",encoding="utf-8")

      - name: Commit dev-only Web deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "TakKa Build"
          git config user.email "80165829+takka-d@users.noreply.github.com"
          git add dev/0.3.13
          if ! git diff --cached --quiet; then
            git commit -m "Deploy Cross Rhythm 0.3.13 development builds (noindex)"
            git push origin main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CrossRhythm-WebGL-0.3.13-dev
          path: UnityProject/Builds/Web
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: CrossRhythm-Windows-0.3.13-dev
          path: UnityProject/Builds/Windows
          retention-days: 7

      - name: Return temporary Unity Personal license
        if: always()
        shell: bash
        run: |
          unity license return --yes --format json || true
