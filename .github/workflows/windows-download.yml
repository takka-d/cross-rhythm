name: Windows direct download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-download.yml'
      - 'dev/0.3.37/windows/RELEASE-NOTES.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-download-0.3.37
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dev/0.3.37/windows
          persist-credentials: false
      - name: Assemble and verify tested Windows package
        working-directory: dev/0.3.37/windows
        run: |
          cat CrossRhythm_Windows_0.3.37.zip.part1 CrossRhythm_Windows_0.3.37.zip.part2 > CrossRhythm_Windows_0.3.37.zip
          sha256sum --check SHA256SUMS.txt
          unzip -tq CrossRhythm_Windows_0.3.37.zip
      - name: Publish direct ZIP download
        working-directory: dev/0.3.37/windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.3.37 --json tagName >/dev/null 2>&1; then
            digest="$(gh api "repos/$GH_REPO/releases/tags/v0.3.37" --jq '.assets[] | select(.name=="CrossRhythm_Windows_0.3.37.zip") | .digest')"
            test "$digest" = 'sha256:f1e25e442a5f800826a0d4b760299b277fd7be33f51fc6e8c9dbdb81c9c21069'
            gh release edit v0.3.37 --notes-file RELEASE-NOTES.md
          else
            gh release create v0.3.37 CrossRhythm_Windows_0.3.37.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Cross Rhythm 0.3.37 · Windows development' --prerelease --latest=false --notes-file RELEASE-NOTES.md
          fi
