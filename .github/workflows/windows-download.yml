name: Windows direct download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-download.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-download-0.3.19
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dev/0.3.19/windows
          persist-credentials: false
      - name: Assemble and verify tested Windows package
        working-directory: dev/0.3.19/windows
        run: |
          cat CrossRhythm_Windows_0.3.19.zip.part1 CrossRhythm_Windows_0.3.19.zip.part2 > CrossRhythm_Windows_0.3.19.zip
          sha256sum --check SHA256SUMS.txt
          unzip -tq CrossRhythm_Windows_0.3.19.zip
      - name: Publish direct ZIP download
        working-directory: dev/0.3.19/windows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.3.19 --json tagName >/dev/null 2>&1; then
            gh release upload v0.3.19 CrossRhythm_Windows_0.3.19.zip SHA256SUMS.txt --clobber
          else
            printf '%s\n' 'Windows 64bit development build.' '' 'Practice pitch preservation and timing fixes, application icon, and controller preset labels.' '' 'Extract the ZIP and run CrossRhythm.exe. Web 0.3.19 verification is in progress.' > release-notes.txt
            gh release create v0.3.19 CrossRhythm_Windows_0.3.19.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Cross Rhythm 0.3.19 · Windows development' --prerelease --latest=false --notes-file release-notes.txt
          fi

