name: Cross Rhythm CI config probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-config-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report Unity CI configuration presence
        env:
          S_LICENSE: ${{ secrets.UNITY_LICENSE }}
          S_EMAIL: ${{ secrets.UNITY_EMAIL }}
          S_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          S_SERIAL: ${{ secrets.UNITY_SERIAL }}
          S_USERNAME: ${{ secrets.UNITY_USERNAME }}
          S_TOKEN: ${{ secrets.UNITY_ACCESS_TOKEN }}
          V_LICENSE: ${{ vars.UNITY_LICENSE }}
          V_EMAIL: ${{ vars.UNITY_EMAIL }}
          V_PASSWORD: ${{ vars.UNITY_PASSWORD }}
          V_SERIAL: ${{ vars.UNITY_SERIAL }}
          V_USERNAME: ${{ vars.UNITY_USERNAME }}
          V_TOKEN: ${{ vars.UNITY_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          for k in [
              'S_LICENSE','S_EMAIL','S_PASSWORD','S_SERIAL','S_USERNAME','S_TOKEN',
              'V_LICENSE','V_EMAIL','V_PASSWORD','V_SERIAL','V_USERNAME','V_TOKEN'
          ]:
              v=os.environ.get(k,'')
              print(f"{k}={'SET' if v else 'EMPTY'} length={len(v)}")
          PY
