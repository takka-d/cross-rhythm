name: Inspect approved Unity auth channel state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-channel-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect channel request schema without response contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          cid="K6YMfHDdD29OTl0sI3AskviwfflxRwqm6KJC"
          data=json.loads(urllib.request.urlopen("https://services.api.unity.com/app-linking/v1/channels/"+cid,timeout=20).read().decode())["channel"]
          req=data.get("Request") or {}
          print("request_keys", sorted(req.keys()))
          for k,v in req.items():
              if isinstance(v,dict):
                  print(k+"_keys", sorted(v.keys()))
                  for kk,vv in v.items():
                      if kk.lower()=="content":
                          try:
                              parsed=json.loads(vv) if isinstance(vv,str) else vv
                              if isinstance(parsed,dict):
                                  print(k+"."+kk+"_json_keys",sorted(parsed.keys()))
                                  for pkey,pval in parsed.items():
                                      if isinstance(pval,str):
                                          print(k+"."+kk+"."+pkey+"_len",len(pval))
                                      else:
                                          print(k+"."+kk+"."+pkey+"_type",type(pval).__name__)
                              else:
                                  print(k+"."+kk+"_type",type(parsed).__name__)
                          except Exception:
                              print(k+"."+kk+"_len",len(vv) if isinstance(vv,str) else None)
                      elif isinstance(vv,str):
                          print(k+"."+kk+"_len",len(vv))
                      else:
                          print(k+"."+kk+"_type",type(vv).__name__)
              elif isinstance(v,str):
                  safe=v if k.lower() in ("appname","request") and len(v)<80 else None
                  print(k, safe if safe is not None else "str_len="+str(len(v)))
              else:
                  print(k+"_type",type(v).__name__)
          print("response_present", bool(data.get("Response")))
          PY
