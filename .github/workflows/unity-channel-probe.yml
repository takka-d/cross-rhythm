name: Inspect approved Unity auth channel state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unity-channel-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe nested channel metadata without exposing response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          ids=["K6YMfHDdD29OTl0sI3AskviwfflxRwqm6KJC","59sRyjcqQWzfDWEuMDwQKRkfb61fWG0FZumF"]
          for cid in ids:
              try:
                  with urllib.request.urlopen("https://services.api.unity.com/app-linking/v1/channels/"+cid,timeout=20) as r:
                      data=json.loads(r.read().decode())
                  ch=data.get("channel")
                  out={"channel":cid[:8]+"...","http":200,"outer_keys":sorted(data.keys()),"channel_type":type(ch).__name__}
                  if isinstance(ch,dict):
                      out["channel_keys"]=sorted(ch.keys())
                      for k,v in ch.items():
                          lk=k.lower()
                          if "response" in lk or "request" in lk or "content" in lk:
                              out[k+"_present"]=v not in (None,"")
                              out[k+"_type"]=type(v).__name__
                              if isinstance(v,(str,list,dict)): out[k+"_length"]=len(v)
                  print(json.dumps(out))
              except urllib.error.HTTPError as e:
                  print(json.dumps({"channel":cid[:8]+"...","http":e.code}))
              except Exception as e:
                  print(json.dumps({"channel":cid[:8]+"...","error":type(e).__name__}))
          PY
